name = "phonedeals-uk-api"
compatibility_date = "2024-06-08"
main = "worker/src/index.ts"
pages_build_output_dir = "dist/phonedeals-uk/browser"

# This routes all /api/* requests to this worker if deploying to a custom domain
# Update zone_name to your actual domain name when ready to deploy

routes = [
  { pattern = "mobello.uk/api/*", zone_name = "mobello.uk" }
]


[[d1_databases]]
binding = "DB"
database_name = "phonedeals-uk-db"
database_id = "c42d58ea-707a-4d15-aa1c-9d79d618bd80" # REPLACE with output of: wrangler d1 create phonedeals-uk-db

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "phonedeals-uk-images"

[[kv_namespaces]]
binding = "SESSIONS"
id = "fff098953b324e2ab262f1a249727aa9" # REPLACE with output of: wrangler kv:namespace create SESSIONS

[vars]
JWT_SECRET = "local-dev-placeholder-secret-change-me"
RESEND_API_KEY = "re_JbPnNZrQ_8HTocs59m9K61n5q1NhRPgT5"
# R2_PUBLIC_URL = "https://pub-5dd1d3d0c28a496fade1529ff89a1222.r2.dev"
# Set after enabling R2 public access in Cloudflare Dashboard:
# R2_PUBLIC_URL = "https://pub-XXXXXXXX.r2.dev"
# Or use a custom domain:
# R2_PUBLIC_URL = "https://images.phonedealsuk.co.uk"

# ─── Email (Resend) ───────────────────────────────────────────────────────────
# RESEND_API_KEY is a secret — do NOT put the real value here.
# Set it once using:
#   wrangler secret put RESEND_API_KEY
# Then paste your key from https://resend.com/api-keys when prompted.
#
# Sender email is configured in: worker/src/utils/email.ts → SENDER_EMAIL constant
# For testing, the default is onboarding@resend.dev (works on Resend free plan).
# For production, replace with a verified domain address (e.g. orders@phonedeals.co.uk).

