name: Deploy PhoneDeals UK

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare Secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ Missing required secrets: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            echo "Please add them in: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ Cloudflare secrets found"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Worker Dependencies
        run: cd worker && npm ci

      - name: Apply D1 Database Migrations
        run: cd worker && npx wrangler d1 migrations apply phonedeals-uk-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Prerender Routes
        run: node scripts/generate-prerender-routes.mjs
        env:
          API_URL: https://api.phonedealsuk.co.uk

      - name: Build Angular Application
        run: npx ng build --configuration=production

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy dist/phonedeals-uk/browser --project-name=phonedeals-uk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
